name: Build Edge-to-Edge APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Official Mock Google Services
        run: |
          cp .github/mock-google-services.json app/google-services.json
          cp .github/mock-google-services.json automotive/google-services.json || true
          cp .github/mock-google-services.json wear/google-services.json || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Minimal Debug APK
        run: ./gradlew assembleMinimalDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeAssistant-EdgeToEdge-Debug
          path: app/build/outputs/apk/minimal/debug/*.apk
          retention-days: 7
