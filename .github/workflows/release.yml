name: Production Deploy

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  release:
    types: [released]

env:
  SUPPLY_UPLOAD_MAX_RETRIES: 5

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Never cancel a Play Store promotion in flight

permissions:
  contents: read

jobs:
  play_promote_production:
    name: Play Publish Production
    runs-on: ubuntu-latest
    if: github.repository == 'home-assistant/android'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0.7"
          bundler-cache: false

      - uses: $/.github/actions/inflate-secrets
        name: Inflate Secrets
        with:
          keystore: ${{ secrets.ORIGINAL_KEYSTORE_FILE }}
          google-services: ${{ secrets.GOOGLESERVICES }}
          playstore-creds: ${{ secrets.PLAYSTORECREDS }}

      - name: Install Fastlane dependencies
        run: bundle install

      - name: Promote Beta to Production Play Store
        run: bundle exec fastlane promote_to_production
