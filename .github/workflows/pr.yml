# TOREVERT: stripped down to the jobs needed to exercise the E2E workflow from
# this PR. Restore the full version from main (plus the build_e2e_inputs and
# e2e_tests jobs, minus build_emulator_wtf_apks) before merging.
name: Pull Request

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:

# This workflow should cancel previous builds since it means that a new commit has been made to the PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_e2e_inputs:
    name: "Build E2E inputs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build-env
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          mock-google-services: "true"

      # The Maestro APK disables StrictMode so violations don't kill the app
      # mid flow; the instrumentation APKs below keep StrictMode enforcement.
      - name: Build Maestro APK (StrictMode disabled)
        run: |
          ./gradlew :app:assembleFullDebug -PnoStrictMode -Pabis=x86,x86_64
          mkdir -p e2e-inputs
          cp app/build/outputs/apk/full/debug/app-full-debug.apk e2e-inputs/maestro-app-full-debug.apk

      - name: Build instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleAndroidTest -Pabis=x86,x86_64

      # The Maestro flows and Home Assistant config are shipped alongside the
      # APKs so the E2E workflow tests this PR's versions of them. They are
      # copied out of their dotted directories because upload-artifact skips
      # hidden paths by default.
      - name: Stage E2E inputs
        run: |
          cp app/build/outputs/apk/full/debug/app-full-debug.apk e2e-inputs/
          cp app/build/outputs/apk/minimal/debug/app-minimal-debug.apk e2e-inputs/
          cp app/build/outputs/apk/androidTest/full/debug/app-full-debug-androidTest.apk e2e-inputs/
          cp app/build/outputs/apk/androidTest/minimal/debug/app-minimal-debug-androidTest.apk e2e-inputs/
          cp -R .maestro e2e-inputs/maestro-flows
          cp -R .github/e2e/homeassistant e2e-inputs/homeassistant-config

      - name: Upload E2E inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-inputs
          retention-days: 1
          if-no-files-found: error
          path: e2e-inputs

  # TOREVERT: temporary invocation of the E2E workflow through workflow_call so
  # this PR's version can be validated before it lands on main. workflow_run
  # only fires from the default branch definition; once merged, that trigger in
  # e2e.yml takes over and this job must be removed to avoid running the E2E
  # suite twice. Note this mode does not support fork PRs (no OIDC/secrets on
  # pull_request from forks); the workflow_run trigger is the permanent path.
  # When restoring the full workflow, this job also needs
  # `needs: [unit_tests, screenshot_test]` back so the publish job finds their
  # artifacts.
  e2e_tests:
    name: "E2E"
    needs: [build_e2e_inputs]
    permissions:
      contents: read
      id-token: write
      checks: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/e2e.yml
