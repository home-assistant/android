name: E2E

on: # yamllint disable-line rule:truthy
  workflow_run:
    workflows: ['Pull Request']
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

# Runs everything that needs an emulator in a single emulator.wtf session,
# since emulator.wtf bills by the minute: instrumentation tests for both
# flavors, then the Maestro onboarding flow.
#
# This workflow is workflow_run-triggered so it also covers fork PRs: a
# pull_request-triggered workflow from a fork gets no secrets, no environment
# access and no id-token permission. The untrusted PR code is only built in the
# 'Pull Request' workflow; here we exclusively consume its artifacts (APKs,
# Maestro flows, Home Assistant config) as data, never execute PR code on the
# runner, and the environment gate applies before any credential is issued.
jobs:
  emulator_tests:
    name: "Emulator tests"
    runs-on: ubuntu-latest
    environment: ui-test
    if: >
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
    permissions:
      id-token: write  # Needed for OIDC authentication
      actions: read  # Needed for retrieving artifacts
      checks: write  # Needed to publish this job's status as a PR check
    env:
      E2E_FORWARD_IP: 172.16.0.2
      E2E_HOME_ASSISTANT_VERSION: 2026.7.4
      E2E_HOME_ASSISTANT_HOST: ha.internal
      E2E_HOME_ASSISTANT_URL: http://ha.internal:8123
      E2E_HOME_ASSISTANT_USERNAME: citest
      E2E_HOME_ASSISTANT_PASSWORD: "h7jk99&U"
      MAESTRO_VERSION: 2.7.0
      MARATHON_VERSION: 0.10.5
    steps:
      # Surface this job's own success/failure as a check on the PR commit.
      # workflow_run jobs are detached from the PR, so the status is not shown
      # otherwise. A check run created via the API for a PR-head SHA gets grouped
      # under an arbitrary existing check suite on that commit; the suite
      # cannot be chosen via the API. Every input here comes from the trusted
      # workflow_run context (no fork-controlled data is consumed).
      - name: Create PR check (in progress)
        id: create_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # On PR-context check_suites GitHub absorbs API-created check_runs into
        # the triggering "Pull Request" workflow's suite and silently rewrites
        # details_url to the legacy `runs/{check_run_id}` form, which lands on
        # an empty synthetic-job page in the parent run. We can't prevent that,
        # but a Markdown link in output.summary renders on whichever page the
        # Details button ends up showing, so the real emulator.wtf job logs
        # are always one click away.
        run: |
          # Identify this job by its runner, not by display name. GitHub does
          # not expose the current job's database id directly (no GITHUB_JOB_ID,
          # no /actions/jobs/current endpoint — confirmed against the REST API
          # docs), and $GITHUB_JOB is the YAML key, not the id we need for the
          # URL. The jobs API returns a `runner_name` field on every job, and
          # the runner exports its name as $RUNNER_NAME, so matching the two
          # uniquely identifies this job regardless of how many siblings exist.
          # `env.RUNNER_NAME` is jq's safe way to read the env var (no shell
          # interpolation of the value into the filter string).
          JOB_ID=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.runner_name == env.RUNNER_NAME) | .id][0]' || true)
          # Defence-in-depth: only use JOB_ID in a URL if it looks like an id.
          # gh returns integers here, but validating keeps the URL safe even if
          # GitHub's response format ever changes, and guards against the
          # selector ever matching zero or multiple jobs.
          if [[ "$JOB_ID" =~ ^[0-9]+$ ]]; then
            JOB_URL="$RUN_URL/job/$JOB_ID"
          else
            JOB_URL="$RUN_URL"
          fi
          SUMMARY="Full logs: [open this emulator.wtf job →]($JOB_URL)"
          check_id=$(jq -n \
              --arg sha "$HEAD_SHA" \
              --arg url "$JOB_URL" \
              --arg summary "$SUMMARY" \
              '{
                 name: "Emulator tests",
                 head_sha: $sha,
                 status: "in_progress",
                 details_url: $url,
                 output: {title: "Running on emulator.wtf", summary: $summary}
               }' \
            | gh api --method POST "repos/$REPO/check-runs" --input - --jq '.id')
          {
            echo "check_id=$check_id"
            echo "job_url=$JOB_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Download E2E inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-inputs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: e2e-inputs

      - name: Verify E2E inputs
        run: |
          for f in \
            e2e-inputs/app-full-debug.apk \
            e2e-inputs/app-minimal-debug.apk \
            e2e-inputs/app-full-debug-androidTest.apk \
            e2e-inputs/app-minimal-debug-androidTest.apk \
            e2e-inputs/maestro-app-full-debug.apk \
            e2e-inputs/maestro-flows/onboarding.yaml \
            e2e-inputs/homeassistant-config/configuration.yaml; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty E2E input: $f"
              exit 1
            fi
          done

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Maestro CLI
        run: |
          export MAESTRO_VERSION
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Marathon runs the prebuilt instrumentation APKs over adb without
      # Gradle, so no untrusted PR code executes on this runner, and it
      # produces JUnit XML (published as a PR check by the publish job below)
      # plus an HTML report, with a proper exit code on failures.
      - name: Install Marathon CLI
        run: |
          curl -fsSL -o marathon.zip \
            "https://github.com/MarathonLabs/marathon/releases/download/${MARATHON_VERSION}/marathon-${MARATHON_VERSION}.zip"
          unzip -q marathon.zip -d "$HOME/marathon-cli"
          echo "$HOME/marathon-cli/marathon-${MARATHON_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Prepare Marathon configuration
        run: |
          cat > Marathonfile-full <<'EOF'
          name: "app-full-debug"
          outputDir: "marathon-results/full"
          vendorConfiguration:
            type: "Android"
            applicationApk: "e2e-inputs/app-full-debug.apk"
            testApplicationApk: "e2e-inputs/app-full-debug-androidTest.apk"
          EOF

          cat > Marathonfile-minimal <<'EOF'
          name: "app-minimal-debug"
          outputDir: "marathon-results/minimal"
          vendorConfiguration:
            type: "Android"
            applicationApk: "e2e-inputs/app-minimal-debug.apk"
            testApplicationApk: "e2e-inputs/app-minimal-debug-androidTest.apk"
          EOF

      # The configuration is PR-controlled data, but it only drives a throwaway
      # Home Assistant container holding no secrets.
      - name: Start Home Assistant
        id: homeassistant
        uses: ludeeus/setup-homeassistant@27c93bb42c944a9973941bd05d32b3a451017073 # main
        with:
          tag: ${{ env.E2E_HOME_ASSISTANT_VERSION }}
          config-dir: e2e-inputs/homeassistant-config

      - name: Verify Home Assistant setup
        env:
          HOME_ASSISTANT_TOKEN: ${{ steps.homeassistant.outputs.token }}
          HOME_ASSISTANT_URL: ${{ steps.homeassistant.outputs.url }}
        run: |
          curl -sSf \
            -H "Authorization: Bearer $HOME_ASSISTANT_TOKEN" \
            "$HOME_ASSISTANT_URL/api/config" \
            > homeassistant-config.json

          jq -e '.components | index("mobile_app") != null' homeassistant-config.json >/dev/null

      - uses: emulator-wtf/actions/configure-credentials@72f86422814fad7432a286a1b29699cc9e73d561 # v1.1.0
        with:
          oidc-configuration-id: ${{ vars.EMULATOR_WTF_OIDC_CONFIGURATION_ID }}

      - name: Start emulator
        id: emulator
        uses: emulator-wtf/actions/use-emulator@72f86422814fad7432a286a1b29699cc9e73d561 # v1.1.0
        with:
          devices: |
            model=Pixel7,version=34
          egress-tunnel: true
          egress-localhost-fwd-ip: ${{ env.E2E_FORWARD_IP }}
          dns-override: |
            ${{ env.E2E_HOME_ASSISTANT_HOST }}=${{ env.E2E_FORWARD_IP }}
          max-time-limit: 45m

      - name: Resolve emulator serial
        id: device
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          $ADB wait-for-device

          SERIAL=$($ADB devices | awk 'NR > 1 && $2 == "device" { print $1; exit }')
          if [ -z "$SERIAL" ]; then
            echo "::error::No emulator connected through adb"
            $ADB devices
            exit 1
          fi

          until [ "$($ADB -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            sleep 1
          done

          echo "serial=$SERIAL" >> "$GITHUB_OUTPUT"

      - name: Run instrumentation tests full
        run: marathon -m Marathonfile-full

      - name: Run instrumentation tests minimal
        run: marathon -m Marathonfile-minimal

      # The Maestro APK is a separate build with StrictMode disabled so
      # violations don't kill the app mid flow; instrumentation above keeps
      # StrictMode enforcement.
      - name: Install Maestro APK
        env:
          ANDROID_SERIAL: ${{ steps.device.outputs.serial }}
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" install -r e2e-inputs/maestro-app-full-debug.apk

      - name: Run Maestro onboarding flow
        env:
          ANDROID_SERIAL: ${{ steps.device.outputs.serial }}
          HOME_ASSISTANT_URL: ${{ env.E2E_HOME_ASSISTANT_URL }}
          HOME_ASSISTANT_USERNAME: ${{ env.E2E_HOME_ASSISTANT_USERNAME }}
          HOME_ASSISTANT_PASSWORD: ${{ env.E2E_HOME_ASSISTANT_PASSWORD }}
        run: |
          export PATH="$PATH:$HOME/.maestro/bin"

          maestro --device "$ANDROID_SERIAL" test \
            --test-output-dir maestro-results \
            -e HOME_ASSISTANT_URL="$HOME_ASSISTANT_URL" \
            -e HOME_ASSISTANT_USERNAME="$HOME_ASSISTANT_USERNAME" \
            -e HOME_ASSISTANT_PASSWORD="$HOME_ASSISTANT_PASSWORD" \
            e2e-inputs/maestro-flows/onboarding.yaml

      - name: Capture Android logs
        if: always() && steps.device.outputs.serial != ''
        env:
          ANDROID_SERIAL: ${{ steps.device.outputs.serial }}
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" logcat -d > logcat.txt

      - name: Capture Home Assistant logs
        if: always() && steps.homeassistant.outputs.containername != ''
        run: docker logs --timestamps ${{ steps.homeassistant.outputs.containername }} > homeassistant.log 2>&1

      - name: Capture Home Assistant container details
        if: always() && steps.homeassistant.outputs.containername != ''
        run: docker inspect ${{ steps.homeassistant.outputs.containername }} > homeassistant-container.json

      - name: Capture Home Assistant file log
        if: always()
        run: |
          if [ -f e2e-inputs/homeassistant-config/home-assistant.log ]; then
            cp e2e-inputs/homeassistant-config/home-assistant.log homeassistant-file.log
          fi

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          if-no-files-found: warn
          path: |
            homeassistant-config.json
            homeassistant.log
            homeassistant-file.log
            homeassistant-container.json
            logcat.txt
            marathon-results
            maestro-results

      # job.status reflects everything above and is one of
      # success/failure/cancelled, all valid check-run conclusions.
      # We re-send the same output.summary link so the completed check page
      # keeps the deep-link to the emulator.wtf job logs (see the Create step
      # for why this matters on PR-context check_suites).
      - name: Finalize PR check
        if: always() && steps.create_check.outputs.check_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHECK_ID: ${{ steps.create_check.outputs.check_id }}
          CONCLUSION: ${{ job.status }}
          JOB_URL: ${{ steps.create_check.outputs.job_url }}
        run: |
          SUMMARY="Full logs: [open this emulator.wtf job →]($JOB_URL)"
          jq -n \
              --arg conclusion "$CONCLUSION" \
              --arg summary "$SUMMARY" \
              '{
                 status: "completed",
                 conclusion: $conclusion,
                 output: {title: "Completed on emulator.wtf", summary: $summary}
               }' \
            | gh api --method PATCH "repos/$REPO/check-runs/$CHECK_ID" --input -

  publish_test_results:
    name: "Publish Tests Results"
    needs: [emulator_tests]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      actions: read
      contents: read
    steps:
      - name: Download artifacts from Pull Request run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: pr-artifacts

      # If emulator_tests was skipped (non-PR trigger or triggering workflow did
      # not succeed) or cancelled/failed before running tests, it may upload no
      # artifacts, and downloading them by name errors. Tolerate that so we
      # still publish the pr.yml results below. We cannot gate on
      # needs.emulator_tests.result because a real test failure also fails the
      # job yet does produce this artifact, which we must still publish.
      - name: Download E2E artifacts from this run
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-artifacts
          path: pr-artifacts/e2e-artifacts

      # Build a minimal event payload from the trusted workflow_run context.
      # Supplying any event_file flips the is_fork check to false in the
      # publish-unit-test-result-action source
      # (publish_test_results.py: `is_fork = event_file is None and ...`), so it
      # publishes the check run instead of disabling it for fork PRs. We build
      # the payload here from trusted context rather than forwarding the real
      # pull_request payload, which on a fork PR could be forged.
      # The PR for the failures comment is resolved from the commit SHA via the
      # API (the action's publisher.py get_pulls_from_commit), so no PR number
      # is needed here.
      #
      # This payload is intentionally minimal: it was verified sufficient against
      # publish-unit-test-result-action (the pinned SHA below). Every
      # other event field the action reads degrades gracefully when absent (it
      # only drops the cosmetic "vs base"/"vs earlier" deltas). If you bump the
      # action version, re-check which event fields it reads and update this.
      - name: Build minimal event payload
        env:
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          jq -n --arg head "$HEAD_REPO" \
            '{pull_request: {head: {repo: {full_name: $head}}}}' > event.json

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_name: ${{ github.event.workflow_run.event }}
          event_file: "event.json"
          comment_mode: "failures"
          action_fail: true
          files: |
            pr-artifacts/**/TEST-*.xml
            pr-artifacts/**/results.xml
            pr-artifacts/**/marathon_junit_report.xml
