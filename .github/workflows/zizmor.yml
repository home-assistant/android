name: Zizmor GitHub Actions security analysis

# Scans the GitHub Actions workflows and composite actions with zizmor on every
# pull request and weekly on main, and uploads the findings to GitHub Code
# Scanning. Any finding fails the run: fix it, or suppress it inline with a
# `# zizmor: ignore[...]` comment and a reason. Nothing is accepted implicitly.
# Adapted from home-assistant/core#179632.

on: # yamllint disable-line rule:truthy
  pull_request:
  schedule:
    # Weekly re-scan (Mondays 05:30 UTC) so the online audits catch newly
    # published advisories. A failed weekly run opens or updates an issue.
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions: {}

env:
  # renovate: datasource=pypi depName=uv
  UV_VERSION: "0.13.3"
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: "1.31.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor_scan:
    name: Zizmor scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # To check out the repository
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }} # Read-only, for the online audits
        run: |
          # Compiled gh-aw workflows (*.lock.yml) are generated by `gh aw compile`,
          # so findings there cannot be fixed or suppressed in place. They are excluded.
          # The exit code is deferred to the last step, so the SARIF is always produced.
          git ls-files -z -- \
            '.github/workflows/*.yml' '.github/workflows/*.yaml' \
            '.github/actions/*/action.yml' '.github/actions/*/action.yaml' \
            '.github/dependabot.yml' '.github/dependabot.yaml' \
            ':!.github/workflows/*.lock.yml' \
            | xargs -0 uvx "zizmor==${ZIZMOR_VERSION}" \
              --pedantic --strict-collection --no-exit-codes \
              --no-progress --format=sarif > zizmor.sarif

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zizmor-sarif
          path: zizmor.sarif
          if-no-files-found: error
          retention-days: 1

      - name: Report findings
        run: |
          jq -r '.runs[].results[] | "\(.level): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) [\(.ruleId)] \(.message.text)"' zizmor.sarif
          count="$(jq '[.runs[].results[]] | length' zizmor.sarif)"
          if [[ "${count}" -gt 0 ]]; then
            echo "::error::zizmor reported ${count} finding(s), listed above and in the Security tab under Code scanning. Fix them, or add an inline 'zizmor: ignore' comment with a reason."
            exit 1
          fi
          echo "No findings."

  upload_zizmor_reports:
    name: Upload Zizmor reports
    needs: zizmor_scan
    if: ${{ !cancelled() && github.repository == 'home-assistant/android' }} # Upload the findings even when the scan failed on them
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # To download the SARIF artifact of this run
      contents: read # To check out the scanned commit for fingerprinting
      security-events: write # To upload the findings to Code Scanning
    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zizmor-sarif

      - name: Check out scanned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: zizmor.sarif
          category: zizmor
          checkout_path: ${{ github.workspace }}/src

  open-failure-issue:
    name: Open zizmor failure issue
    needs: zizmor_scan
    if: github.event_name == 'schedule' && failure() && github.repository == 'home-assistant/android'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # To open or comment on the zizmor-failure issue
    steps:
      - name: Open or comment on the zizmor-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Empty when the label does not exist yet, i.e. nothing ever failed.
          NUMBER=$(gh issue list --label zizmor-failure --state open --json number --jq '.[0].number' || true)
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "The weekly zizmor scan failed again in $RUN_URL."
          else
            gh issue create --label zizmor-failure \
              --title "Weekly zizmor scan of the GitHub Actions workflows failed" \
              --body "The scheduled zizmor scan on main failed: $RUN_URL. Review the findings in the run log or under Security > Code scanning."
          fi
