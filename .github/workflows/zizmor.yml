name: Zizmor GitHub Actions security analysis

# Pull requests run the strict offline scan; main runs the online scan, publishes
# the findings to GitHub Code Scanning and fails when there are any. Findings are
# fixed or suppressed inline with a `# zizmor: ignore[...]` comment and a reason,
# never accepted implicitly. Adapted from home-assistant/core#179632.

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly re-scan (Mondays 05:30 UTC) so the online audits catch newly
    # published advisories and the code scanning results stay fresh.
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions: {}

env:
  # renovate: datasource=pypi depName=uv
  UV_VERSION: "0.13.3"
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: "1.31.1"
  # Compiled gh-aw workflows (*.lock.yml) are generated by `gh aw compile`, so
  # findings there cannot be fixed or suppressed in place. They are excluded
  # from both scans, as in core.
  SCAN_PATHSPEC: >-
    .github/workflows/*.yml
    .github/workflows/*.yaml
    .github/actions/*/action.yml
    .github/actions/*/action.yaml
    .github/dependabot.yml
    .github/dependabot.yaml
    :!.github/workflows/*.lock.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Check GitHub Actions workflows
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # To check out the pull request merge commit
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run Zizmor
        run: |
          read -ra pathspec <<< "${SCAN_PATHSPEC}"
          git ls-files -z -- "${pathspec[@]}" \
            | xargs -0 uvx "zizmor==${ZIZMOR_VERSION}" \
              --pedantic --offline --strict-collection --no-progress

  report:
    name: Scan main GitHub Actions
    if: github.repository == 'home-assistant/android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # To check out the main commit
    steps:
      - name: Check out main
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Generate SARIF
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_SHA: ${{ steps.checkout.outputs.commit }}
        run: |
          # Online audits need GH_TOKEN. The exit code is deferred to the upload
          # job so the SARIF reaches Code Scanning before the run fails.
          read -ra pathspec <<< "${SCAN_PATHSPEC}"
          git ls-files -z -- "${pathspec[@]}" \
            | xargs -0 uvx "zizmor==${ZIZMOR_VERSION}" \
              --pedantic --strict-collection --no-exit-codes \
              --no-progress --format=sarif > zizmor.sarif
          printf '%s\n' "${SCAN_SHA}" > sha.txt

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zizmor-sarif-main
          path: |
            zizmor.sarif
            sha.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  upload:
    name: Upload main findings to Code Scanning
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # To download the same-run SARIF artifact
      contents: read # To check out the scanned commit for fingerprinting
      security-events: write # To upload findings to Code Scanning
    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zizmor-sarif-main

      - name: Read scanned commit
        id: sha
        run: echo "sha=$(cat sha.txt)" >> "${GITHUB_OUTPUT}"

      - name: Check out scanned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false
          path: src

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: zizmor.sarif
          category: zizmor
          checkout_path: ${{ github.workspace }}/src
          ref: refs/heads/main
          sha: ${{ steps.sha.outputs.sha }}

      - name: Fail on findings
        run: |
          count="$(jq '[.runs[].results[]] | length' zizmor.sarif)"
          if [[ "${count}" -gt 0 ]]; then
            echo "::error::zizmor reported ${count} finding(s) on main. Review them in the Security tab, then fix them or add an inline 'zizmor: ignore' comment with a reason."
            exit 1
          fi
          echo "No findings on main."
