name: "Upload test results"
description: "Upload test result (always) and test reports (on failure) as artifacts."
inputs:
  test-name:
    description: "Name of the test used as prefix for the artifact names."
    required: true
  job-status:
    description: >-
      Status of the calling job, pass the job.status context. Reports are only uploaded when it is
      `failure`.
    required: true
runs:
  using: "composite"
  steps:
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.test-name }} results
        path: |
          **/build/test-results/**/TEST-*.xml
          **/build/test-results/**/results.xml
          **/build/outputs/*/connected/*

    - name: Upload test reports
      if: ${{ inputs.job-status == 'failure' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.test-name }} reports
        path: |
          **/build/reports/**
