# yamllint disable rule:document-start
appId: io.homeassistant.companion.android.debug
---
# Granting all permissions upfront keeps the flow deterministic across API
# levels: otherwise system permission dialogs (nearby devices, notifications)
# cover the UI at API-level-dependent moments.
- launchApp:
    clearState: true
    permissions:
      all: allow

- tapOn:
    text: '(?s)Connect to my Home.*Assistant server'
    retryTapIfNoChange: true

# On API 33+ the discovery screen triggers the NEARBY_WIFI_DEVICES system
# dialog, which Maestro's launchApp permissions do not cover. The regex
# tolerates the typographic apostrophe in "Don't allow".
- tapOn:
    text: "Don.t allow"
    optional: true
    retryTapIfNoChange: true

- tapOn:
    text: "Enter address manually"
    retryTapIfNoChange: true

- assertVisible:
    text: '(?s)What is your Home.*Assistant address.*'
- tapOn: "http://homeassistant.local:8123"
- inputText: ${HOME_ASSISTANT_URL}
# Dismiss the keyboard and Gboard's first-run tooltip, which can cover the
# Connect button.
- hideKeyboard
- tapOn:
    text: "Connect"
    retryTapIfNoChange: true

# Generous timeouts from here on: all shards load the frontend from the single
# Home Assistant container at the same time, so pages appear much slower than
# on a lone device.
#
# The login form autofocuses the username field, and on old WebViews
# (Chromium 69, API 26-28) the resulting focus churn keeps the accessibility
# tree from ever settling, so the wait never sees the page even once rendered.
# The neutral tap blurs the field to let the tree settle; the retry re-blurs
# and re-checks, since the first tap may land before the page has loaded.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          point: 50%,25%
      - extendedWaitUntil:
          visible: "Log in"
          timeout: 20000

- tapOn: "Username"
- inputText: ${HOME_ASSISTANT_USERNAME}
- tapOn: "Password"
- inputText: ${HOME_ASSISTANT_PASSWORD}
- hideKeyboard
- tapOn:
    text: "Log in"
    retryTapIfNoChange: true
- tapOn:
    text: "Authorize"
    optional: true

- extendedWaitUntil:
    visible: "How would you like to name this device?"
    timeout: 60000

- tapOn:
    text: "Save"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Got it"
    timeout: 30000

- tapOn:
    text: "Got it"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Use this device's location for automations"
    timeout: 15000

- tapOn:
    text: "Do not share my location"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Let us help secure your remote connection"
    timeout: 15000

- tapOn:
    text: "Less secure: Do not allow this app to know when you're home"
    retryTapIfNoChange: true
- tapOn:
    text: "Next"
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible: "Let us help secure your remote connection"
    timeout: 10000

# The notification permission prompt can cover the frontend once it loads
# (API 33+): its modal sheet also prunes the accessibility tree behind it, so
# wait for either the frontend or the sheet, dismiss the sheet if present, and
# only then assert on the frontend.
- extendedWaitUntil:
    visible:
      text: '(?i)^(Overview|More details|Do not allow)$'
    timeout: 60000
- tapOn:
    text: "Do not allow"
    optional: true
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible:
      text: '(?i)^(Overview|More details)$'
    timeout: 60000

- tapOn:
    text: '(?i)^More details$'
    optional: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      text: '(?i)^Overview$'
    timeout: 3000

- tapOn:
    text: '(?i)^Sidebar toggle$'
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 2500

- extendedWaitUntil:
    visible:
      text: '(?i)^Settings$'
    timeout: 10000
- tapOn:
    text: '(?i)^Settings$'
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 2500

- extendedWaitUntil:
    visible:
      text: '(?is).*Companion app.*'
    timeout: 10000
- tapOn:
    text: '(?is).*Companion app.*'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Servers & devices"
    timeout: 10000
